name: Build Android APK

on:
  push:
    branches: [ "main" ]
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Android Debug APK
        working-directory: android
        run: |
          gradle assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/Viatom_Monitor_Android_v1.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Viatom_Monitor_Android_APK
          path: release-apk/Viatom_Monitor_Android_v1.0.0.apk
          if-no-files-found: error

      - name: Update GitHub Release v1.0.0 with APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0 release-apk/Viatom_Monitor_Android_v1.0.0.apk --clobber || echo "Release upload skipped if release not found"
